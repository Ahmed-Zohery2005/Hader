# ============================================================================
# حاضر — تطبيق الموظف (Flutter / Android-first)
# "حاضر… مش بس بصمت" — إثبات التواجد: فيديو 8 ثوانٍ برقم منطوق
# ============================================================================
name: hader_employee
description: حاضر — إثبات التواجد الفعلي للموظفين (فيديو 8 ثوانٍ برقم عشوائي، فحوصات مفاجئة عادلة، وخصوصية بقانون 151/2020)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # الحالة والبنية
  flutter_riverpod: ^2.6.1

  # الخدمات الخلفية (Supabase Auth + Postgres RLS + Edge Functions)
  supabase_flutter: ^2.8.0

  # الكاميرا الأمامية فقط + كشف الوجه (ML Kit)
  camera: ^0.11.0
  image_picker: ^1.1.2  # سيلفي التفعيل فقط — الكاميرا الأمامية، لا معرض
  google_mlkit_face_detection: ^0.12.0

  # ضغط H.264 480p + البصمة SHA-256
  video_compress: ^3.1.3
  video_player: ^2.9.2  # مشاهدة تسجيلاتي (رابط 5 دقائق)
  crypto: ^3.0.6

  # التخزين الآمن + طابور الأوفلاين المشفر AES-256-GCM
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0

  # إشارات المكان والأجهزة
  geolocator: ^13.0.1
  device_info_plus: ^11.2.0
  connectivity_plus: ^6.0.5

  # الإشعارات الثلاثية + نبضة الاتصال
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  workmanager: ^0.5.2

  # أدوات
  intl: ^0.20.2
  uuid: ^4.5.1
  http: ^1.2.2
  path_provider: ^2.1.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # اتجاه RTL أصيل — النصوص عربية مصرية بالكامل
  assets:
    - assets/brand/
